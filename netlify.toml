# Netlify configuration (owner: GEO). BUILD-SPEC §9. Setup steps: README.md, section 3.
#
# Headers and redirects are GENERATED by the build into dist/_headers and dist/_redirects
# (build/lib/machine.mjs: per-page CSP with the hashes of the inline scripts, /embed/* framable,
# MIME + CORS for /models/*, routes.mjs redirects, per-language 404 fallbacks). Do not add
# [[headers]] or [[redirects]] here: Netlify would merge them with the generated ones and
# comma-join repeated header values (two CSPs = the intersection of both).
# No catch-all redirect: the only splat rules are the 404 fallbacks ("/en/*  /en/404.html  404").

[build]
  command = "npm run build && npm run check"
  publish = "dist"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  # Node 24 LTS: the version the generator and the QA are developed and tested with
  # (package.json "engines" accepts >= 20; Node 20 reached end of life in April 2026).
  NODE_VERSION = "24"
  # Placeholders (brand, domain, contact, legal in build/data/site.mjs) make the PRODUCTION
  # context fail on purpose. Deploy previews and branch deploys never fail for them (pages are
  # noindex while they exist). For a pre-launch production deploy, set ALLOW_PLACEHOLDERS=1 in
  # Site configuration → Environment variables (Production context) and remove it at launch.

[build.processing.html]
  pretty_urls = false

# The Markdown edge function (netlify/edge-functions/markdown.js) declares its own routing in code
# (`export const config`): path "/*", static files excluded, and it only runs when the request's
# Accept header asks for text/markdown, so browsers never invoke it.
# The IndexNow ping (netlify/functions/deploy-succeeded.mjs) is an event-triggered function: its
# file name is the event, no declaration needed; it only acts in the production context.
